name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Lint, Typecheck, Content & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js (22.x) with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint Code Quality
        run: pnpm run lint

      - name: TypeScript Type Safety
        run: pnpm run typecheck

      - name: Validate Markdown Content & Metadata
        run: pnpm run validate-content

      - name: Next.js Production Build
        run: pnpm run build
